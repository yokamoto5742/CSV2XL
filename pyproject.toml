[project]
name = "csv2xl"
version = "1.1.5"
requires-python = ">=3.13"

dependencies = [
    "numpy>=2.2.0",
    "openpyxl>=3.1.5",
    "polars>=1.17.1",
    "psutil>=6.1.0",
    "pyautogui>=0.9.54",
    "pyqt6>=6.8.0",
    "pywin32>=308",
]

[dependency-groups]
dev = [
    "coverage>=7.10.1",
    "pyinstaller>=6.14.2",
    "pyright>=1.1.407",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["app", "services", "utils", "tests"]
exclude = ["scripts"]
reportMissingTypeStubs = false
reportUnusedVariable = true
reportUnusedImport = true